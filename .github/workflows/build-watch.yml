name: Build T-Rex 3 ZAB
on:
  push:
    branches: [main]
    paths:
      - 'WatchApp/**'
      - '.github/workflows/build-watch.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Zeus CLI
        run: npm install -g @zeppos/zeus-cli
      - name: Diagnose Zepp devices
        run: |
          zeus --version
          zeus device list || true
          cat WatchApp/app.json

      - name: Build Zepp OS package
        working-directory: WatchApp
        run: |
          zeus build 2>&1 | tee zeus-build.log
          if grep -q "\[ERROR\]" zeus-build.log; then
            echo "Zeus zgłosił błąd"
            exit 1
          fi
          find . -type f -name "*.zab" | grep -q .
      - name: Show build output
        run: find WatchApp -type f \( -name '*.zab' -o -name '*.zip' \)
      - uses: actions/upload-artifact@v4
        with:
          name: VoiceNotesAI-TREX3-build
          path: |
            WatchApp/**/*.zab
            WatchApp/**/*.zip
          if-no-files-found: error
