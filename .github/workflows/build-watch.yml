name: Build T-Rex 3 ZAB

on:
  push:
    branches: [main]
    paths:
      - 'WatchApp/**'
      - '.github/workflows/build-watch.yml'
  pull_request:
    paths:
      - 'WatchApp/**'
      - '.github/workflows/build-watch.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Zeus CLI
        run: npm install -g @zeppos/zeus-cli@1.10.2
      - name: Build Zepp OS package
        working-directory: WatchApp
        run: zeus build
      - uses: actions/upload-artifact@v4
        with:
          name: VoiceNotesAI-TREX3-build
          path: WatchApp/dist/*.zab
          if-no-files-found: error
